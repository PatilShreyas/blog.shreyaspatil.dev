<svg width="1312" height="736" viewBox="0 0 1312 736" xmlns="http://www.w3.org/2000/svg">
   <defs>
     <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#FAF6F0"/>
       <stop offset="1" stop-color="#F3E9DD"/>
     </linearGradient>
     <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#FFFDFB"/>
       <stop offset="0.5" stop-color="#FAF6F0"/>
       <stop offset="1" stop-color="#F3E9DD"/>
     </linearGradient>
     
     <linearGradient id="chipA" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#EBC08B"/><stop offset="1" stop-color="#9C6B43"/>
     </linearGradient>
     <linearGradient id="chipB" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#FAD484"/><stop offset="1" stop-color="#C28F27"/>
     </linearGradient>
     <linearGradient id="chipC" x1="0" y1="0" x2="1" y2="1">
       <stop offset="0" stop-color="#CCD991"/><stop offset="1" stop-color="#728C3C"/>
     </linearGradient>

     <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
       <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4A3B32" flood-opacity="0.12"/>
     </filter>
   </defs>

   <rect width="1312" height="736" fill="url(#bg)"/>

   <g stroke="#C2B2A3" stroke-opacity="0.3" stroke-width="1">
     <path d="M0,92 H1312 M0,184 H1312 M0,276 H1312 M0,368 H1312 M0,460 H1312 M0,552 H1312 M0,644 H1312" />
     <path d="M164,0 V736 M328,0 V736 M492,0 V736 M656,0 V736 M820,0 V736 M984,0 V736 M1148,0 V736" />
   </g>

   <!-- isometric transform group -->
   <g transform="translate(656 392) skewY(-26) skewX(0) scale(1 0.86)">
     <!-- phone body -->
     <g filter="url(#soft)">
       <rect x="-250" y="-300" width="500" height="640" rx="56" fill="#F3E9DD" stroke="#2b2f3a" stroke-width="6"/>
       <rect x="-218" y="-262" width="436" height="564" rx="34" fill="url(#screen)"/>
       
       <rect x="-186" y="-180" width="372" height="280" rx="20" fill="none" stroke="#9C6B43" stroke-width="6" stroke-dasharray="8 12" opacity="0.65"/>
     </g>
   </g>

   <!-- floating slot cards -->
   <g filter="url(#soft)">
     
     <g transform="translate(430 350)">
       <rect width="330" height="92" rx="18" fill="#ffffff"/>
       <rect x="20" y="22" width="48" height="48" rx="12" fill="url(#chipA)"/>
       <text x="86" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#2b2f3a">Measurement</text>
       <text x="86" y="64" font-family="Inter, sans-serif" font-size="12" fill="#807a75">Size Constraints pass</text>
     </g>
     
     <g transform="translate(490 230)">
       <rect width="330" height="92" rx="18" fill="#ffffff"/>
       <rect x="20" y="22" width="48" height="48" rx="12" fill="url(#chipB)"/>
       <text x="86" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#2b2f3a">Subcomposition</text>
       <text x="86" y="64" font-family="Inter, sans-serif" font-size="12" fill="#807a75">Inside the measure phase</text>
     </g>
     
     <g transform="translate(560 110)">
       <rect width="330" height="92" rx="18" fill="#ffffff"/>
       <rect x="20" y="22" width="48" height="48" rx="12" fill="url(#chipC)"/>
       <text x="86" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#2b2f3a">Placement</text>
       <text x="86" y="64" font-family="Inter, sans-serif" font-size="12" fill="#807a75">Coordinate pass</text>
     </g>
   </g>

   <!-- measure ruler accent -->
   <g stroke="#9C6B43" stroke-width="3" opacity="0.6">
     <line x1="915" y1="130" x2="950" y2="130"/>
     <line x1="932" y1="130" x2="932" y2="380"/>
     <line x1="915" y1="380" x2="950" y2="380"/>
   </g>

   <!-- Branding Footer -->
   <text x="60" y="680" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A89F96" letter-spacing="2">BLOG.SHREYASPATIL.DEV</text>
   <text x="1250" y="680" text-anchor="end" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#A89F96" letter-spacing="2">JETPACK COMPOSE INTERNALS</text>
 </svg>
